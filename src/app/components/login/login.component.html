<div class="auth-page">
  <mat-card>
    <mat-card-content class="auth-card">
      <h2>Login</h2>
      <p>Log in to work with your own datasets, save alignments, and keep settings.</p>
      <mat-form-field appearance="fill" class="auth-field">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" autocomplete="username">
      </mat-form-field>
      <mat-form-field appearance="fill" class="auth-field">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" autocomplete="current-password" (keyup.enter)="submit()">
      </mat-form-field>
      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="submitting">Login</button>
      <p class="auth-switch">No account yet? <a routerLink="/register">Register</a></p>
    </mat-card-content>
  </mat-card>
</div>
