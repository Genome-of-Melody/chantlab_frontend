<h2 mat-dialog-title>Generation failed</h2>
<mat-dialog-content>
  <p>
    The generation took too long or failed with an error.
  </p>
  <p>
    Try again with a smaller dataset, fewer selected chants, or simpler settings.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>OK</button>
</mat-dialog-actions>
