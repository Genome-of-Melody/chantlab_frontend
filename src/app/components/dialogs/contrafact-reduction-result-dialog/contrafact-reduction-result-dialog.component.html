<h2 mat-dialog-title>Reduction to Contrafacts</h2>
<mat-dialog-content>
  <h4>Process Completed Successfully:</h4>
  @if (reducedSequenceIds?.length === 0) {
    <p> no contrafacts were found</p>
  }
  @if (reducedSequenceIds?.length > 0) {
    <p>
      {{ reducedSequenceIds.length }} sequences were reduced and made invisible
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>OK</button>
</mat-dialog-actions>
