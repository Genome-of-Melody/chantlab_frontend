<div class="alignment-list">
  @for (alignment of availableAlignments; track alignment; let i = $index) {
    <div>
      <mat-radio-group [(ngModel)]="selectedAlignment">
        <mat-radio-button class="alignment-radio" [value]="alignment">{{ alignment }}</mat-radio-button>
      </mat-radio-group>
    </div>
  }
</div>
