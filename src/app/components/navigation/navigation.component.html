<div class=flexbox-container>
    <div>
        <button mat-fab color="accent" aria-label="home" [routerLink]="''">
            <mat-icon >home</mat-icon>
        </button>
        <a mat-button [routerLink]="'/chants'"> Chant list </a>
        @if (authService.isLoggedIn()) {
          <a mat-button [routerLink]="'/upload'"> Manage data </a>
          <a mat-button [routerLink]="'/alignment-manager'"> Manage alignments </a>
        }
        <a mat-button [routerLink]="'/dashboard'"> Dashboard </a>
        @if (authService.isLoggedIn()) {
          <a mat-button [routerLink]="'/settings'"> Settings </a>
        }
        <a mat-button [routerLink]="'/about'"> About </a>
    </div>
    <div class="auth-and-search">
        @if (authService.isLoggedIn()) {
          <span class="username">{{ authService.username }}</span>
          <a mat-button (click)="logout()">Logout</a>
        } @else {
          <a mat-button [routerLink]="'/login'">Login</a>
          <a mat-button [routerLink]="'/register'">Register</a>
        }
        <mat-form-field floatLabel=never class="searchBar">
            <mat-icon matPrefix>search</mat-icon>
            <input type="search"
                (keyup.enter)="search($event)"
                placeholder="Search incipit"
                [value]="searchValue"
                matInput>
        </mat-form-field>
    </div>
</div>
